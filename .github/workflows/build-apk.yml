name: Build APK

on:
  workflow_dispatch:
  push:
    branches: [main, master]

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - uses: gradle/actions/setup-gradle@v4

      - name: Add swap
        run: |
          sudo fallocate -l 8G /swapfile
          sudo chmod 600 /swapfile
          sudo mkswap /swapfile
          sudo swapon /swapfile
          free -h

      - name: Accept Android SDK licenses
        run: |
          SDKMANAGER=$(ls -d "$ANDROID_HOME"/cmdline-tools/*/bin/sdkmanager | head -1)
          yes | "$SDKMANAGER" --licenses > /dev/null || true

      # Debug-only experimental TF Lite detector breaks manifest merging; not needed for the app.
      - name: Drop debug-only TensorFlow Lite
        run: |
          sed -i '/org\.tensorflow/d' app/build.gradle.kts
          rm -f app/src/debug/java/com/aryan/reader/ml/ComicPanelDetector.kt

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Build OSS debug APK
        run: >
          ./gradlew assembleOssDebug --no-daemon --max-workers=1
          -Dorg.gradle.jvmargs="-Xmx2g -XX:MaxMetaspaceSize=768m -Dfile.encoding=UTF-8"
          -Pkotlin.daemon.jvmargs=-Xmx3g

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: episteme-oss-debug-apk
          path: app/build/outputs/**/*.apk
          if-no-files-found: error
