name: Build APK

on:
  workflow_dispatch:
  push:
    branches: [main, master]

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      # Installs the Android SDK and accepts its licenses so Gradle can fetch what it needs.
      - uses: android-actions/setup-android@v3

      - uses: gradle/actions/setup-gradle@v4

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Unit tests (do not block the APK)
        continue-on-error: true
        run: ./gradlew --no-daemon testOssDebugUnitTest

      - name: Build OSS debug APK
        run: ./gradlew --no-daemon assembleOssDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: episteme-oss-debug-apk
          path: app/build/outputs/**/*.apk
          if-no-files-found: error
